# tmux — adapted from github.com/omerxx/dotfiles (tmux/), Vesper status bar.
# Used on demand; Ghostty tabs/splits remain the default. Prefix: Ctrl-A.
# Reload: prefix R   ·   Plugins: prefix I (install) / prefix U (update)

# ── Terminal ─────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g extended-keys on
set -g focus-events on
set -g set-clipboard on          # OSC 52 → system clipboard (Ghostty: clipboard-write = allow)
set -g allow-passthrough on      # images / OSC sequences from nvim etc.

# ── Behaviour ────────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off     # closing a session switches to another instead of exiting
set -g escape-time 0
set -g history-limit 1000000
set -g mouse on
setw -g mode-keys vi

# ── Key bindings ─────────────────────────────────────────────────────
bind a   send-prefix             # prefix a → literal Ctrl-A (shell: beginning of line)
bind C-a last-window
bind R   source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind r   command-prompt -I "#W" "rename-window '%%'"
bind C-c new-window -c "#{pane_current_path}"
bind C-d detach
bind S   choose-session
bind w   list-windows
bind '"' choose-window
bind z   resize-pane -Z
bind K   send-keys clear Enter

# Splits keep the current directory: v = side by side, s = stacked
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Pane / window navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind H previous-window
bind L next-window
bind x swap-pane -D
bind -r , resize-pane -L 20
bind -r . resize-pane -R 20
bind -r - resize-pane -D 7
bind -r = resize-pane -U 7

bind c   confirm-before -p "kill pane #P? (y/n)" kill-pane
bind *   setw synchronize-panes \; display "synchronize-panes: #{?synchronize-panes,on,off}"
bind P   set pane-border-status

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ── Vesper look ──────────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=#A0A0A0"
set -g status-left-length 40
set -g status-left "#[fg=#101010,bg=#FFC799,bold] #S #[bg=default,nobold] "
set -g status-right-length 60
set -g status-right "#{?client_prefix,#[fg=#FFC799 bold]PREFIX ,}#{?window_zoomed_flag,#[fg=#99FFE4]ZOOM ,}#[fg=#7E7E7E]#{b:pane_current_path}"
setw -g window-status-format "#[fg=#7E7E7E] #I #W "
setw -g window-status-current-format "#[fg=#FFC799,bold] #I #W "
setw -g window-status-separator ""
set -g pane-border-style "fg=#232323"
set -g pane-active-border-style "fg=#FFC799"
set -g pane-border-lines single
set -g message-style "bg=#1C1C1C,fg=#E6E1DA"
set -g message-command-style "bg=#1C1C1C,fg=#FFC799"
setw -g mode-style "bg=#3A3226,fg=#E6E1DA"
set -g display-panes-active-colour "#FFC799"
set -g display-panes-colour "#505050"
setw -g clock-mode-colour "#FFC799"

# ── Plugins (TPM) ────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# resurrect/continuum: auto-save every 15 min, restore when the tmux server starts
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# sessionx (prefix o): fuzzy session picker with zoxide
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-custom-paths '/Users/pratikbhavarthe/Pluto'
set -g @sessionx-custom-paths-subdirectories 'true'
set -g @sessionx-filter-current 'false'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-bind-zo-new-window 'ctrl-y'

# floax (prefix p): floating scratch pane
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color '#FFC799'
set -g @floax-text-color '#E6E1DA'
set -g @floax-change-path 'true'

# fzf-url (prefix u): pick a URL from the screen and open it
set -g @fzf-url-history-limit '2000'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="url> " --border-label=" Open URL "'

run '~/.config/tmux/plugins/tpm/tpm'
