"$schema" = 'https://starship.rs/config-schema.json'

# Vesper "bubbles" — port of oh-my-posh's bubblesextra theme to Starship.
# Line 1: bubbles for path · git · toolchains · infra
# Line 2: plain text — duration · jobs · exit code · user ❯
#
# All glyphs are written as TOML escapes (\uXXXX) so editors/tools can't strip
# Private Use Area characters. Pill caps: \uE0B6 (left) \uE0B4 (right), drawn by Ghostty.
# Previous versions: ~/.config/shell-backups/starship.toml.*   Debug: starship explain

palette = "vesper"
add_newline = true
command_timeout = 500
scan_timeout = 30

format = """
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$golang\
$nodejs\
$bun\
$rust\
$ruby\
$java\
$docker_context\
$kubernetes\
$aws\
${env_var.AWS_PROD_WARNING}
$cmd_duration\
$jobs\
$status\
$username\
$character"""

[palettes.vesper]
pill = "#322D27"      # bubble background (bubblesextra uses navy #29315A)
amber = "#FFC799"
peach = "#FFCFA8"
mint = "#99FFE4"
red = "#FF8080"
lavender = "#B9AEDA"
pink = "#E29ECA"
sand = "#E6B99D"
fg = "#E6E1DA"
muted = "#A0A0A0"
dim = "#8A847C"
ink = "#101010"

# ── Line 1 ───────────────────────────────────────────────────────────
[hostname]
ssh_only = true
format = "[\uE0B6](fg:pill)[\uF489 $hostname](bold fg:mint bg:pill)[\uE0B4](fg:pill) "

# path: folder icon, parent dim, repo name bold amber, sub-path off-white
[directory]
format = "[\uE0B6](fg:pill)[\uE5FF $path]($style)[$read_only]($read_only_style)[\uE0B4](fg:pill) "
repo_root_format = "[\uE0B6](fg:pill)[\uE5FF ](fg:amber bg:pill)[$before_root_path](fg:dim bg:pill)[$repo_root](bold fg:amber bg:pill)[$path]($style)[$read_only]($read_only_style)[\uE0B4](fg:pill) "
style = "fg:fg bg:pill"
before_repo_root_style = "fg:dim bg:pill"
repo_root_style = "bold fg:amber bg:pill"   # must be set for repo_root_format to apply
read_only = " \uF023"
read_only_style = "fg:red bg:pill"
home_symbol = "~"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"

# git: one bubble. Branch opens it, git_status fills counts and always closes it.
#   main ↑1 ↓2  ~3 ?1  +2  1
[git_branch]
format = "[\uE0B6](fg:pill)[\uE0A0 $branch(:$remote_branch)](fg:mint bg:pill)"
truncation_length = 25
truncation_symbol = "…"

[git_state]
format = "[ \\($state( $progress_current/$progress_total)\\)](bold fg:red bg:pill)"

[git_status]
format = "($ahead_behind$conflicted$modified$deleted$renamed$untracked$staged$stashed)[\uE0B4](fg:pill) "
ahead = "[ ↑$count](fg:lavender bg:pill)"
behind = "[ ↓$count](fg:lavender bg:pill)"
diverged = "[ ↑$ahead_count ↓$behind_count](bold fg:peach bg:pill)"
up_to_date = ""
conflicted = "[ !$count](bold fg:red bg:pill)"
modified = "[ \uF044 ~$count](fg:amber bg:pill)"
deleted = "[ -$count](fg:red bg:pill)"
renamed = "[ »$count](fg:amber bg:pill)"
untracked = "[ ?$count](fg:muted bg:pill)"
staged = "[ \uF046 +$count](fg:mint bg:pill)"
stashed = "[ \uEB4B $count](fg:lavender bg:pill)"

# ── Toolchains (only inside projects that use them) ──────────────────
[python]
format = "[\uE0B6](fg:pill)[$symbol($virtualenv )$version]($style)[\uE0B4](fg:pill) "
symbol = "\uE235 "
style = "fg:sand bg:pill"
version_format = "${major}.${minor}.${patch}"

[golang]
format = "[\uE0B6](fg:pill)[$symbol$version]($style)[\uE0B4](fg:pill) "
symbol = "\uE626 "
style = "fg:lavender bg:pill"
version_format = "${major}.${minor}.${patch}"

[nodejs]
format = "[\uE0B6](fg:pill)[$symbol$version]($style)[\uE0B4](fg:pill) "
symbol = "\uE718 "
style = "fg:mint bg:pill"
not_capable_style = "bold fg:red bg:pill"
version_format = "${major}.${minor}.${patch}"

[bun]
format = "[\uE0B6](fg:pill)[$symbol$version]($style)[\uE0B4](fg:pill) "
symbol = "\uE76F "
style = "fg:pink bg:pill"
version_format = "${major}.${minor}.${patch}"

[rust]
format = "[\uE0B6](fg:pill)[$symbol$version]($style)[\uE0B4](fg:pill) "
symbol = "\uE7A8 "
style = "fg:peach bg:pill"
version_format = "${major}.${minor}.${patch}"

[ruby]
format = "[\uE0B6](fg:pill)[$symbol$version]($style)[\uE0B4](fg:pill) "
symbol = "\uE791 "
style = "fg:red bg:pill"
version_format = "${major}.${minor}.${patch}"

[java]
format = "[\uE0B6](fg:pill)[$symbol$version]($style)[\uE0B4](fg:pill) "
symbol = "\uE738 "
style = "fg:peach bg:pill"
version_format = "${major}.${minor}.${patch}"

# ── Infrastructure ───────────────────────────────────────────────────
[docker_context]
format = "[\uE0B6](fg:pill)[$symbol$context]($style)[\uE0B4](fg:pill) "
symbol = "\uF308 "
style = "fg:lavender bg:pill"
only_with_files = true

[kubernetes]
disabled = false
format = "[\uE0B6](fg:pill)[$symbol$context( \\($namespace\\))]($style)[\uE0B4](fg:pill) "
symbol = "\U000F10FE "
style = "fg:lavender bg:pill"
detect_files = ["Chart.yaml", "kustomization.yaml", "skaffold.yaml", "helmfile.yaml", "Tiltfile"]
detect_folders = ["k8s", "kubernetes", "helm", "charts", "manifests"]

[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style = "bold fg:red bg:pill"
context_alias = "PROD $0"

# AWS_PROFILE is always set (pratik-pluto), so that profile is hidden; others show.
[aws]
format = "([\uE0B6](fg:pill)[$symbol$profile]($style)[\uE0B4](fg:pill) )"
symbol = "\uE7AD "
style = "fg:peach bg:pill"
force_display = true

[aws.profile_aliases]
pratik-pluto = ""

# Solid red bubble; set by a precmd hook in ~/.config/zsh/plugins.zsh when AWS_PROFILE matches *prod*.
[env_var.AWS_PROD_WARNING]
format = "[\uE0B6](fg:red)[$env_value]($style)[\uE0B4](fg:red) "
style = "bold fg:ink bg:red"

# ── Line 2: plain colored text (bubbles on adjacent lines would touch) ──
[cmd_duration]
min_time = 500
format = "[$duration]($style)  "
style = "fg:muted"

[jobs]
format = "[$symbol$number]($style)  "
symbol = "✦ "
style = "fg:lavender"
number_threshold = 1

[status]
disabled = false
format = "[✘ $status]($style)  "
style = "bold fg:red"

[username]
show_always = true
format = "[$user]($style) "
style_user = "fg:amber"
style_root = "bold fg:red"
aliases = { "pratikbhavarthe" = "pratik" }

[character]
success_symbol = "[❯](bold fg:amber)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:mint)"
